<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brumessenger</title>
    <script src="https://cdn.ably.io/lib/ably.min-1.js"></script>

</head>
<body>
    <div class="container">
        <div id="authScreen" class="auth-container">
            <h1>🗨️ Brumessenger</h1>
            <p>Connect with friends instantly</p>
            
            <div class="input-group">
                <label for="username">Username</label>
                <input type="text" id="username" placeholder="Enter your username" />
            </div>
            
            <div class="input-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Enter your password" />
            </div>
            
            <button class="btn btn-primary" onclick="login()">Login</button>
            <button class="btn btn-secondary" onclick="signup()">Sign Up</button>
            
            <div id="authMessage"></div>
        </div>

        <div id="chatScreen" class="hidden">
            <div id="adminPanel" class="admin-panel hidden">
                <h3>👑 Admin Dashboard</h3>
                <button class="admin-btn" onclick="viewAllUsers()">View All Users & Passwords</button>
                <button class="admin-btn" onclick="viewSignupNotifications()">New Signups <span id="notifBadge" class="notification-badge hidden">0</span></button>
            </div>

            <div class="chat-container">
                <div class="sidebar">
                    <div class="sidebar-header">
                        <h2 id="currentUserName"></h2>
                        <small>Online now</small>
                    </div>
                    <div id="usersList" class="users-list"></div>
                    <button class="logout-btn" onclick="logout()">Logout</button>
                </div>

                <div class="chat-area">
                    <div id="emptyState" class="empty-state">
                        <div class="empty-state-icon">💬</div>
                        <h3>Select a user to start chatting</h3>
                    </div>

                    <div id="activeChat" class="hidden" style="display: flex; flex-direction: column; height: 100%;">
                        <div class="chat-header">
                            <h3 id="chatUsername"></h3>
                        </div>
                        <div id="messagesContainer" class="messages-container"></div>
                        <div class="message-input-container">
                            <input type="text" id="messageInput" class="message-input" placeholder="Type a message..." onkeypress="if(event.key==='Enter') sendMessage()" />
                            <button class="send-btn" onclick="sendMessage()">Send</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="adminModal" class="hidden admin-modal" onclick="if(event.target===this) this.classList.add('hidden')">
        <div class="admin-modal-content" onclick="event.stopPropagation()">
            <h2 id="modalTitle"></h2>
            <div id="modalContent"></div>
            <button class="btn btn-secondary close-modal" onclick="document.getElementById('adminModal').classList.add('hidden')">Close</button>
        </div>
    </div>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            width: 100%;
            max-width: 1200px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }
        .auth-container {
            padding: 60px 40px;
            text-align: center;
            max-width: 400px;
            margin: 0 auto;
        }
        .auth-container h1 {
            color: #667eea;
            margin-bottom: 10px;
            font-size: 2.5em;
        }
        .auth-container p {
            color: #666;
            margin-bottom: 30px;
        }
        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }
        .input-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
        }
        .input-group input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            transition: border-color 0.3s;
        }
        .input-group input:focus {
            outline: none;
            border-color: #667eea;
        }
        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 10px;
        }
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
        }
        .btn-secondary {
            background: white;
            color: #667eea;
            border: 2px solid #667eea;
        }
        .btn-secondary:hover {
            background: #667eea;
            color: white;
        }
        .btn-danger {
            background: #e74c3c;
            color: white;
        }
        .btn-danger:hover {
            background: #c0392b;
        }
        .error-message {
            background: #fee;
            color: #c00;
            padding: 12px;
            border-radius: 8px;
            margin-top: 15px;
            font-size: 14px;
        }
        .success-message {
            background: #efe;
            color: #0a0;
            padding: 12px;
            border-radius: 8px;
            margin-top: 15px;
            font-size: 14px;
        }
        .chat-container {
            display: grid;
            grid-template-columns: 300px 1fr;
            height: 80vh;
        }
        .sidebar {
            border-right: 1px solid #e0e0e0;
            display: flex;
            flex-direction: column;
        }
        .sidebar-header {
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .sidebar-header h2 {
            font-size: 1.2em;
            margin-bottom: 5px;
        }
        .sidebar-header small {
            opacity: 0.9;
        }
        .users-list {
            flex: 1;
            overflow-y: auto;
        }
        .user-item {
            padding: 15px 20px;
            border-bottom: 1px solid #f0f0f0;
            cursor: pointer;
            transition: background 0.2s;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .user-item:hover {
            background: #f8f9fa;
        }
        .user-item.active {
            background: #e7f3ff;
            border-left: 3px solid #667eea;
        }
        .user-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #ccc;
        }
        .status-dot.online {
            background: #22c55e;
        }
        .admin-badge {
            background: #fbbf24;
            color: #78350f;
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: 600;
        }
        .logout-btn {
            padding: 12px 20px;
            background: #f3f4f6;
            border: none;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.2s;
        }
        .logout-btn:hover {
            background: #e5e7eb;
        }
        .chat-area {
            display: flex;
            flex-direction: column;
        }
        .chat-header {
            padding: 20px;
            border-bottom: 1px solid #e0e0e0;
            background: #f8f9fa;
        }
        .chat-header h3 {
            color: #333;
        }
        .messages-container {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            background: #fafafa;
        }
        .message {
            margin-bottom: 15px;
            display: flex;
            gap: 10px;
        }
        .message.sent {
            flex-direction: row-reverse;
        }
        .message-bubble {
            max-width: 60%;
            padding: 12px 16px;
            border-radius: 18px;
            word-wrap: break-word;
        }
        .message.received .message-bubble {
            background: white;
            color: #333;
            box-shadow: 0 1px 2px rgba(0,0,0,0.1);
        }
        .message.sent .message-bubble {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .message-time {
            font-size: 11px;
            opacity: 0.7;
            margin-top: 4px;
        }
        .message-input-container {
            padding: 20px;
            border-top: 1px solid #e0e0e0;
            display: flex;
            gap: 10px;
        }
        .message-input {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 25px;
            font-size: 15px;
        }
        .message-input:focus {
            outline: none;
            border-color: #667eea;
        }
        .send-btn {
            padding: 12px 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 25px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        .send-btn:hover {
            transform: scale(1.05);
        }
        .empty-state {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100%;
            color: #999;
        }
        .empty-state-icon {
            font-size: 64px;
            margin-bottom: 20px;
        }
        .admin-panel {
            background: #fff3cd;
            padding: 15px 20px;
            border-bottom: 2px solid #ffc107;
        }
        .admin-panel h3 {
            color: #856404;
            margin-bottom: 10px;
        }
        .admin-btn {
            background: #ffc107;
            color: #856404;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            margin-right: 10px;
        }
        .admin-btn:hover {
            background: #e0a800;
        }
        .admin-modal {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .admin-modal-content {
            background: white;
            padding: 30px;
            border-radius: 15px;
            max-width: 600px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
        }
        .admin-modal-content h2 {
            margin-bottom: 20px;
            color: #333;
        }
        .user-card {
            background: #f8f9fa;
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .user-card-info {
            flex: 1;
        }
        .user-card-info strong {
            display: block;
            margin-bottom: 5px;
        }
        .user-card-info small {
            color: #666;
        }
        .delete-user-btn {
            background: #e74c3c;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 12px;
        }
        .delete-user-btn:hover {
            background: #c0392b;
        }
        .close-modal {
            margin-top: 20px;
            width: 100%;
        }
        .hidden {
            display: none !important;
        }
        .notification-badge {
            background: #ef4444;
            color: white;
            font-size: 11px;
            padding: 2px 6px;
            border-radius: 10px;
            font-weight: 600;
        }
    </style>
    <script>
        const API_URL = 'https://brumessenger-backend.vercel.app/api';
        const ABLY_KEY = 'UNMYag.VcluoA:gkmv1VpeHWmrC7W0NJXRcdQZaRAJP0Z5uAj_dooMjuc';
        
        let currentUser = null;
        let selectedUser = null;
        let ably = null;
        let channel = null;
        let users = [];
        let conversations = {};

        async function signup() {
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();
            
            if (!username || !password) {
                showAuthMessage('Please fill in all fields', 'error');
                return;
            }

            try {
                const response = await fetch(`${API_URL}/auth`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: 'signup', username, password })
                });

                const data = await response.json();

                if (data.success) {
                    showAuthMessage('Account created! Please login.', 'success');
                    document.getElementById('password').value = '';
                } else {
                    showAuthMessage(data.error || 'Signup failed', 'error');
                }
            } catch (error) {
                showAuthMessage('Network error. Please try again.', 'error');
                console.error('Signup error:', error);
            }
        }

        async function login() {
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();
            
            if (!username || !password) {
                showAuthMessage('Please fill in all fields', 'error');
                return;
            }

            try {
                const response = await fetch(`${API_URL}/auth`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: 'login', username, password })
                });

                const data = await response.json();

                if (data.success) {
                    currentUser = data.user;
                    initializeChat();
                } else {
                    showAuthMessage(data.error || 'Login failed', 'error');
                }
            } catch (error) {
                showAuthMessage('Network error. Please try again.', 'error');
                console.error('Login error:', error);
            }
        }

        async function initializeChat() {
            document.getElementById('authScreen').classList.add('hidden');
            document.getElementById('chatScreen').classList.remove('hidden');
            document.getElementById('currentUserName').textContent = currentUser.username;

            if (currentUser.isAdmin) {
                document.getElementById('adminPanel').classList.remove('hidden');
                checkNotifications();
            }

            ably = new Ably.Realtime(ABLY_KEY);
            channel = ably.channels.get('brumessenger');

            channel.subscribe('message', (message) => {
                if (message.data.to === currentUser.username) {
                    if (selectedUser && message.data.from === selectedUser) {
                        displayMessage(message.data, 'received');
                    }
                    saveMessageToConversation(message.data);
                }
            });

            channel.subscribe('status', (message) => {
                if (message.data.username !== currentUser.username) {
                    updateUserStatus(message.data.username, message.data.status);
                }
            });

            channel.publish('status', {
                username: currentUser.username,
                status: 'online'
            });

            await loadInbox();
            await loadUsers();
        }

        async function loadInbox() {
            try {
                const response = await fetch(`${API_URL}/get-inbox?username=${currentUser.username}`);
                const data = await response.json();

                if (data.success && data.messages && data.messages.length > 0) {
                    for (const msg of data.messages) {
                        saveMessageToConversation(msg);
                    }

                    await fetch(`${API_URL}/get-inbox?username=${currentUser.username}`, {
                        method: 'DELETE'
                    });
                }
            } catch (error) {
                console.error('Load inbox error:', error);
            }
        }

        async function loadUsers() {
            try {
                const response = await fetch(`${API_URL}/get-users?currentUser=${currentUser.username}`);
                const data = await response.json();

                if (data.success) {
                    users = data.users;
                    renderUsers();
                }
            } catch (error) {
                console.error('Load users error:', error);
            }
        }

        function renderUsers() {
            const usersList = document.getElementById('usersList');
            usersList.innerHTML = '';

            users.forEach(user => {
                const userItem = document.createElement('div');
                userItem.className = 'user-item';
                if (selectedUser === user.username) {
                    userItem.classList.add('active');
                }

                userItem.innerHTML = `
                    <div class="user-info">
                        <div class="status-dot ${user.status === 'online' ? 'online' : ''}"></div>
                        <span>${user.username}</span>
                    </div>
                    ${user.isAdmin ? '<span class="admin-badge">ADMIN</span>' : ''}
                `;

                userItem.onclick = () => selectUser(user.username);
                usersList.appendChild(userItem);
            });
        }

        async function selectUser(username) {
            selectedUser = username;
            document.getElementById('emptyState').classList.add('hidden');
            document.getElementById('activeChat').classList.remove('hidden');
            document.getElementById('chatUsername').textContent = username;
            renderUsers();

            await loadConversationHistory(username);
            renderMessages();
        }

        async function loadConversationHistory(username) {
            try {
                const response = await fetch(`${API_URL}/get-messages?user1=${currentUser.username}&user2=${username}`);
                const data = await response.json();

                if (data.success) {
                    const conversationKey = [currentUser.username, username].sort().join('-');
                    conversations[conversationKey] = data.messages || [];
                }
            } catch (error) {
                console.error('Load conversation error:', error);
            }
        }

        function renderMessages() {
            const container = document.getElementById('messagesContainer');
            container.innerHTML = '';

            const conversationKey = [currentUser.username, selectedUser].sort().join('-');
            const messages = conversations[conversationKey] || [];

            messages.forEach(msg => {
                const type = msg.from === currentUser.username ? 'sent' : 'received';
                displayMessage(msg, type);
            });

            container.scrollTop = container.scrollHeight;
        }

        function displayMessage(messageData, type) {
            const container = document.getElementById('messagesContainer');
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${type}`;

            const time = new Date(messageData.timestamp).toLocaleTimeString([], { 
                hour: '2-digit', 
                minute: '2-digit' 
            });

            messageDiv.innerHTML = `
                <div class="message-bubble">
                    <div>${messageData.message}</div>
                    <div class="message-time">${time}</div>
                </div>
            `;

            container.appendChild(messageDiv);
            container.scrollTop = container.scrollHeight;
        }

        async function sendMessage() {
            const input = document.getElementById('messageInput');
            const message = input.value.trim();

            if (!message || !selectedUser) return;

            const messageData = {
                from: currentUser.username,
                to: selectedUser,
                message,
                timestamp: new Date().toISOString()
            };

            try {
                await fetch(`${API_URL}/send-message`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(messageData)
                });

                channel.publish('message', messageData);

                displayMessage(messageData, 'sent');
                saveMessageToConversation(messageData);

                input.value = '';
            } catch (error) {
                console.error('Send message error:', error);
            }
        }

        function saveMessageToConversation(messageData) {
            const conversationKey = [messageData.from, messageData.to].sort().join('-');
            if (!conversations[conversationKey]) {
                conversations[conversationKey] = [];
            }
            conversations[conversationKey].push(messageData);
        }

        function updateUserStatus(username, status) {
            const user = users.find(u => u.username === username);
            if (user) {
                user.status = status;
                renderUsers();
            }
        }

        async function logout() {
            if (channel) {
                channel.publish('status', {
                    username: currentUser.username,
                    status: 'offline'
                });
            }

            try {
                await fetch(`${API_URL}/update-status`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        username: currentUser.username, 
                        status: 'offline' 
                    })
                });
            } catch (error) {
                console.error('Logout error:', error);
            }

            if (ably) {
                ably.close();
            }

            currentUser = null;
            selectedUser = null;
            users = [];
            conversations = {};

            document.getElementById('chatScreen').classList.add('hidden');
            document.getElementById('authScreen').classList.remove('hidden');
            document.getElementById('username').value = '';
            document.getElementById('password').value = '';
        }

        async function viewAllUsers() {
            try {
                const response = await fetch(`${API_URL}/admin-actions`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        action: 'get-all-users',
                        adminUsername: currentUser.username
                    })
                });

                const data = await response.json();

                if (data.success) {
                    const modal = document.getElementById('adminModal');
                    const modalTitle = document.getElementById('modalTitle');
                    const modalContent = document.getElementById('modalContent');

                    modalTitle.textContent = 'All Users & Passwords';
                    
                    let html = '';
                    data.users.forEach(user => {
                        html += `
                            <div class="user-card">
                                <div class="user-card-info">
                                    <strong>${user.username} ${user.isAdmin ? '👑' : ''}</strong>
                                    <small>Password: ${user.password}</small><br>
                                    <small>Status: ${user.status || 'offline'}</small><br>
                                    <small>Created: ${new Date(user.createdAt).toLocaleDateString()}</small>
                                </div>
                                ${!user.isAdmin ? `<button class="delete-user-btn" onclick="deleteUser('${user.username}')">Delete</button>` : ''}
                            </div>
                        `;
                    });

                    modalContent.innerHTML = html || '<p>No users found</p>';
                    modal.classList.remove('hidden');
                }
            } catch (error) {
                console.error('View users error:', error);
                alert('Failed to load users');
            }
        }

        async function viewSignupNotifications() {
            try {
                const response = await fetch(`${API_URL}/admin-actions?adminUsername=${currentUser.username}&action=get-notifications`);
                const data = await response.json();

                if (data.success) {
                    const modal = document.getElementById('adminModal');
                    const modalTitle = document.getElementById('modalTitle');
                    const modalContent = document.getElementById('modalContent');

                    modalTitle.textContent = 'New Signup Notifications';
                    
                    let html = '';
                    data.notifications.forEach(notif => {
                        html += `
                            <div class="user-card">
                                <div class="user-card-info">
                                    <strong>${notif.username}</strong>
                                    <small>Password: ${notif.password}</small><br>
                                    <small>Signed up: ${new Date(notif.timestamp).toLocaleString()}</small>
                                </div>
                            </div>
                        `;
                    });

                    modalContent.innerHTML = html || '<p>No new signups</p>';
                    modal.classList.remove('hidden');

                    document.getElementById('notifBadge').classList.add('hidden');
                }
            } catch (error) {
                console.error('View notifications error:', error);
                alert('Failed to load notifications');
            }
        }

        async function deleteUser(username) {
            if (!confirm(`Delete user ${username}? This will remove all their messages.`)) {
                return;
            }

            try {
                const response = await fetch(`${API_URL}/admin-actions`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        action: 'delete-user',
                        adminUsername: currentUser.username,
                        targetUsername: username
                    })
                });

                const data = await response.json();

                if (data.success) {
                    alert(`User ${username} deleted successfully`);
                    document.getElementById('adminModal').classList.add('hidden');
                    await loadUsers();
                } else {
                    alert('Failed to delete user: ' + data.error);
                }
            } catch (error) {
                console.error('Delete user error:', error);
                alert('Failed to delete user');
            }
        }

        async function checkNotifications() {
            try {
                const response = await fetch(`${API_URL}/admin-actions?adminUsername=${currentUser.username}&action=get-notifications`);
                const data = await response.json();

                if (data.success && data.notifications && data.notifications.length > 0) {
                    const badge = document.getElementById('notifBadge');
                    badge.textContent = data.notifications.length;
                    badge.classList.remove('hidden');
                }
            } catch (error) {
                console.error('Check notifications error:', error);
            }
        }

        function showAuthMessage(message, type) {
            const authMessage = document.getElementById('authMessage');
            authMessage.className = type === 'success' ? 'success-message' : 'error-message';
            authMessage.textContent = message;
            authMessage.style.display = 'block';

            setTimeout(() => {
                authMessage.style.display = 'none';
            }, 5000);
        }

        window.addEventListener('beforeunload', () => {
            if (currentUser) {
                navigator.sendBeacon(`${API_URL}/update-status`, JSON.stringify({
                    username: currentUser.username,
                    status: 'offline'
                }));
            }
        });
    </script>
</body>
</html>
