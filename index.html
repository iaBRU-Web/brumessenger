<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brumessenger - Fixed</title>
    <script src="https://cdn.ably.com/lib/ably.min-1.js"></script>

</head>
<body>
    <div id="authContainer">
        <div class="auth-header">
            <h1>🚀 Brumessenger</h1>
            <p>Private Messaging Platform - Fixed Version</p>
        </div>

        <div class="error-message" id="authError"></div>
        <div class="success-message" id="authSuccess"></div>

        <div id="loginForm">
            <div class="form-group">
                <label for="loginUsername">Username</label>
                <input type="text" id="loginUsername" placeholder="Enter your username">
            </div>
            <div class="form-group">
                <label for="loginPassword">Password</label>
                <input type="password" id="loginPassword" placeholder="Enter your password">
            </div>
            <button class="btn btn-primary" id="loginBtn">Login</button>
            <button class="btn btn-secondary" id="showSignupBtn">Create Account</button>
        </div>

        <div id="signupForm" class="hidden">
            <div class="form-group">
                <label for="signupUsername">Username</label>
                <input type="text" id="signupUsername" placeholder="Choose a username (min 3 characters)">
            </div>
            <div class="form-group">
                <label for="signupPassword">Password</label>
                <input type="password" id="signupPassword" placeholder="Choose a password (min 6 characters)">
            </div>
            <div class="form-group">
                <label for="signupPasswordConfirm">Confirm Password</label>
                <input type="password" id="signupPasswordConfirm" placeholder="Confirm your password">
            </div>
            <button class="btn btn-primary" id="signupBtn">Create Account</button>
            <button class="btn btn-secondary" id="showLoginBtn">Back to Login</button>
        </div>
    </div>

    <div id="chatContainer">
        <div class="chat-header">
            <h2>💬 Brumessenger</h2>
            <div style="display: flex; align-items: center; gap: 15px;">
                <div class="user-badge" id="currentUsername"></div>
                <button class="btn-logout" id="logoutBtn">Logout</button>
            </div>
        </div>

        <div class="chat-body">
            <div class="sidebar">
                <div class="search-container">
                    <input type="text" class="search-input" id="userSearch" placeholder="🔍 Search users...">
                </div>
                <div class="users-list" id="usersList"></div>
            </div>

            <div class="chat-area">
                <div id="emptyChatState" class="empty-chat">
                    <div class="empty-chat-icon">💬</div>
                    <h3>Select a user to start chatting</h3>
                    <p>Click on any username from the list</p>
                </div>

                <div id="activeChatState" class="hidden" style="display: flex; flex-direction: column; height: 100%;">
                    <div class="chat-with-header">
                        <h3 id="chatWithUser">User</h3>
                        <button class="btn-report" id="reportBtn">🚨 Report User</button>
                    </div>
                    <div class="messages-container" id="messagesContainer"></div>
                    <div class="message-input-container">
                        <div class="message-input-wrapper">
                            <textarea class="message-input" id="messageInput" placeholder="Type your message..." rows="1"></textarea>
                            <button class="btn-send" id="sendBtn">Send</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="reportModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">🚨 Report User</div>
            <div class="modal-body">
                <p style="margin-bottom: 15px; color: #666;">Why are you reporting <strong id="reportUsername" style="color: #667eea;"></strong>?</p>
                <textarea id="reportReason" placeholder="Describe the issue and include any problematic messages..."></textarea>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" id="cancelReportBtn">Cancel</button>
                <button class="btn btn-primary" id="submitReportBtn">Submit Report</button>
            </div>
        </div>
    </div>
    <style>

    <script>
        const CONFIG = {
            ABLY_KEY: 'UNMYag.VcluoA:gkmv1VpeHWmrC7W0NJXRcdQZaRAJP0Z5uAj_dooMjuc',
            BACKEND_URL: 'https://brumessenger-backend.vercel.app/api'
        };

        let currentUser = null;
        let ablyClient = null;
        let allUsers = [];
        let currentChatUser = null;
        let conversations = {};
        let unreadCounts = {};

        document.addEventListener('DOMContentLoaded', () => {
            const savedUser = localStorage.getItem('brumessenger_user');
            if (savedUser) {
                try {
                    currentUser = JSON.parse(savedUser);
                    initializeChat();
                } catch (e) {
                    localStorage.clear();
                }
            }

            document.getElementById('loginBtn').addEventListener('click', handleLogin);
            document.getElementById('signupBtn').addEventListener('click', handleSignup);
            document.getElementById('showSignupBtn').addEventListener('click', () => {
                document.getElementById('loginForm').classList.add('hidden');
                document.getElementById('signupForm').classList.remove('hidden');
                clearMessages();
            });
            document.getElementById('showLoginBtn').addEventListener('click', () => {
                document.getElementById('signupForm').classList.add('hidden');
                document.getElementById('loginForm').classList.remove('hidden');
                clearMessages();
            });
            document.getElementById('logoutBtn').addEventListener('click', handleLogout);
            document.getElementById('sendBtn').addEventListener('click', sendMessage);
            document.getElementById('reportBtn').addEventListener('click', openReportModal);
            document.getElementById('cancelReportBtn').addEventListener('click', closeReportModal);
            document.getElementById('submitReportBtn').addEventListener('click', submitReport);
            
            document.getElementById('messageInput').addEventListener('keypress', (e) => {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    sendMessage();
                }
            });

            document.getElementById('userSearch').addEventListener('input', filterUsers);

            document.getElementById('loginPassword').addEventListener('keypress', (e) => {
                if (e.key === 'Enter') handleLogin();
            });
        });

        async function handleLogin() {
            const username = document.getElementById('loginUsername').value.trim();
            const password = document.getElementById('loginPassword').value;

            if (!username || !password) {
                showError('Please enter username and password');
                return;
            }

            try {
                const response = await fetch(`${CONFIG.BACKEND_URL}/auth`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: 'login', username, password })
                });

                const data = await response.json();

                if (response.ok && data.success) {
                    currentUser = data.user;
                    localStorage.setItem('brumessenger_user', JSON.stringify(currentUser));
                    showSuccess('✅ Login successful!');
                    setTimeout(() => initializeChat(), 1000);
                } else {
                    showError(data.error || 'Login failed. Check your credentials.');
                }
            } catch (error) {
                console.error('Login error:', error);
                showError('Connection error. Please check your internet and try again.');
            }
        }

        async function handleSignup() {
            const username = document.getElementById('signupUsername').value.trim();
            const password = document.getElementById('signupPassword').value;
            const confirmPassword = document.getElementById('signupPasswordConfirm').value;

            if (!username || !password || !confirmPassword) {
                showError('Please fill in all fields');
                return;
            }

            if (username.length < 3) {
                showError('Username must be at least 3 characters');
                return;
            }

            if (password.length < 6) {
                showError('Password must be at least 6 characters');
                return;
            }

            if (password !== confirmPassword) {
                showError('Passwords do not match');
                return;
            }

            try {
                const response = await fetch(`${CONFIG.BACKEND_URL}/auth`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: 'signup', username, password })
                });

                const data = await response.json();

                if (response.ok && data.success) {
                    showSuccess('✅ Account created successfully!');
                    setTimeout(() => {
                        document.getElementById('signupForm').classList.add('hidden');
                        document.getElementById('loginForm').classList.remove('hidden');
                        document.getElementById('loginUsername').value = username;
                        clearMessages();
                    }, 1500);
                } else {
                    showError(data.error || 'Signup failed. Username may be taken.');
                }
            } catch (error) {
                console.error('Signup error:', error);
                showError('Connection error. Please try again.');
            }
        }

        async function handleLogout() {
            if (currentUser) {
                try {
                    await fetch(`${CONFIG.BACKEND_URL}/update-status`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ username: currentUser.username, status: 'offline' })
                    });
                } catch (e) {
                    console.error('Error updating status on logout:', e);
                }
            }
            if (ablyClient) ablyClient.close();
            localStorage.clear();
            location.reload();
        }

        async function initializeChat() {
            document.getElementById('authContainer').style.display = 'none';
            document.getElementById('chatContainer').style.display = 'flex';
            document.getElementById('currentUsername').textContent = currentUser.username;

            // Load conversations from localStorage
            const saved = localStorage.getItem(`conversations_${currentUser.username}`);
            if (saved) {
                try {
                    conversations = JSON.parse(saved);
                } catch (e) {
                    conversations = {};
                }
            }

            const savedUnread = localStorage.getItem(`unread_${currentUser.username}`);
            if (savedUnread) {
                try {
                    unreadCounts = JSON.parse(savedUnread);
                } catch (e) {
                    unreadCounts = {};
                }
            }

            // Initialize Ably
            try {
                ablyClient = new Ably.Realtime(CONFIG.ABLY_KEY);
                console.log('✅ Ably client initialized');
            } catch (error) {
                console.error('Error initializing Ably:', error);
                showError('Failed to connect to messaging service');
            }

            // Update status to online
            try {
                await fetch(`${CONFIG.BACKEND_URL}/update-status`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: currentUser.username, status: 'online' })
                });
            } catch (e) {
                console.error('Error updating status:', e);
            }

            // Load offline messages
            await loadOfflineMessages();

            // Load users
            await loadUsers();
            setInterval(() => loadUsers(), 30000);
            setInterval(() => updateStatus(), 60000);
        }

        // NEW: Load offline messages from inbox
        async function loadOfflineMessages() {
            try {
                const response = await fetch(`${CONFIG.BACKEND_URL}/get-inbox?username=${currentUser.username}`);
                const data = await response.json();

                if (data.success && data.messages && data.messages.length > 0) {
                    console.log(`📬 Received ${data.messages.length} offline messages`);
                    
                    // Process each offline message
                    data.messages.forEach(msg => {
                        const fromUser = msg.from;
                        
                        if (!conversations[fromUser]) {
                            conversations[fromUser] = [];
                        }
                        
                        // Check if message already exists (avoid duplicates)
                        const exists = conversations[fromUser].some(m => 
                            m.timestamp === msg.timestamp && m.text === msg.text
                        );
                        
                        if (!exists) {
                            conversations[fromUser].push(msg);
                            
                            // Increment unread count
                            unreadCounts[fromUser] = (unreadCounts[fromUser] || 0) + 1;
                        }
                    });
                    
                    // Save updated conversations and unread counts
                    localStorage.setItem(`conversations_${currentUser.username}`, JSON.stringify(conversations));
                    localStorage.setItem(`unread_${currentUser.username}`, JSON.stringify(unreadCounts));
                    
                    // Refresh user list to show unread badges
                    if (allUsers.length > 0) {
                        displayUsers(allUsers);
                    }
                }
            } catch (error) {
                console.error('Error loading offline messages:', error);
            }
        }

        async function updateStatus() {
            try {
                await fetch(`${CONFIG.BACKEND_URL}/update-status`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: currentUser.username, status: 'online' })
                });
            } catch (e) {
                console.error('Error updating status:', e);
            }
        }

        async function loadUsers() {
            try {
                const response = await fetch(`${CONFIG.BACKEND_URL}/get-users`);
                const data = await response.json();

                if (data.success) {
                    allUsers = data.users.filter(u => u.username !== currentUser.username);
                    displayUsers(allUsers);
                }
            } catch (error) {
                console.error('Error loading users:', error);
            }
        }

        function displayUsers(users) {
            const usersList = document.getElementById('usersList');
            usersList.innerHTML = '';

            if (users.length === 0) {
                usersList.innerHTML = '<div style="text-align: center; padding: 20px; color: #999;">No users yet</div>';
                return;
            }

            users.forEach(user => {
                const userDiv = document.createElement('div');
                userDiv.className = 'user-item';
                if (currentChatUser === user.username) {
                    userDiv.classList.add('active');
                }

                const isOnline = isUserOnline(user.lastActive);
                const unreadCount = unreadCounts[user.username] || 0;

                userDiv.innerHTML = `
                    <div class="status-dot ${isOnline ? 'online' : ''}"></div>
                    <div class="user-name">${escapeHtml(user.username)}</div>
                    ${unreadCount > 0 ? `<div class="unread-badge">${unreadCount}</div>` : ''}
                `;

                userDiv.addEventListener('click', () => openChat(user.username));
                usersList.appendChild(userDiv);
            });
        }

        async function openChat(username) {
            currentChatUser = username;
            
            // Clear unread count
            unreadCounts[username] = 0;
            localStorage.setItem(`unread_${currentUser.username}`, JSON.stringify(unreadCounts));

            document.getElementById('emptyChatState').style.display = 'none';
            document.getElementById('activeChatState').classList.remove('hidden');
            document.getElementById('activeChatState').style.display = 'flex';
            document.getElementById('chatWithUser').textContent = username;

            // Load messages from server
            await loadMessagesFromServer(username);

            // Subscribe to real-time updates
            subscribeToUser(username);
            
            // Display conversation
            displayConversation(username);
            displayUsers(allUsers);
            document.getElementById('messageInput').focus();
        }

        // NEW: Load messages from server
        async function loadMessagesFromServer(username) {
            try {
                const response = await fetch(
                    `${CONFIG.BACKEND_URL}/get-messages?user1=${currentUser.username}&user2=${username}`
                );
                const data = await response.json();

                if (data.success && data.messages && data.messages.length > 0) {
                    // Merge with local messages
                    conversations[username] = data.messages;
                    localStorage.setItem(`conversations_${currentUser.username}`, JSON.stringify(conversations));
                }
            } catch (error) {
                console.error('Error loading messages from server:', error);
            }
        }

        function subscribeToUser(username) {
            const channelName = [currentUser.username, username].sort().join('-');
            const channel = ablyClient.channels.get(channelName);
            
            channel.subscribe('private-message', (message) => {
                const msg = message.data;
                
                if ((msg.from === username && msg.to === currentUser.username) || 
                    (msg.from === currentUser.username && msg.to === username)) {
                    
                    if (!conversations[username]) {
                        conversations[username] = [];
                    }
                    
                    const exists = conversations[username].some(m => 
                        m.timestamp === msg.timestamp && m.text === msg.text
                    );
                    
                    if (!exists) {
                        conversations[username].push(msg);
                        localStorage.setItem(`conversations_${currentUser.username}`, JSON.stringify(conversations));

                        if (currentChatUser === username) {
                            displayConversation(username);
                        } else if (msg.to === currentUser.username) {
                            unreadCounts[username] = (unreadCounts[username] || 0) + 1;
                            localStorage.setItem(`unread_${currentUser.username}`, JSON.stringify(unreadCounts));
                            displayUsers(allUsers);
                        }
                    }
                }
            });
        }

        async function sendMessage() {
            if (!currentChatUser) return;

            const text = document.getElementById('messageInput').value.trim();
            if (!text) return;

            const message = {
                from: currentUser.username,
                to: currentChatUser,
                text: text,
                timestamp: new Date().toISOString()
            };

            document.getElementById('sendBtn').disabled = true;

            try {
                // Send via Ably for real-time delivery
                const channelName = [currentUser.username, currentChatUser].sort().join('-');
                const channel = ablyClient.channels.get(channelName);
                
                await channel.publish('private-message', message);

                // NEW: Also save to server for offline delivery
                try {
                    await fetch(`${CONFIG.BACKEND_URL}/send-message`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(message)
                    });
                    console.log('✅ Message saved to server');
                } catch (serverError) {
                    console.error('Error saving message to server:', serverError);
                    // Message still sent via Ably, just not stored for offline delivery
                }

                // Update local conversation
                if (!conversations[currentChatUser]) {
                    conversations[currentChatUser] = [];
                }
                conversations[currentChatUser].push(message);
                localStorage.setItem(`conversations_${currentUser.username}`, JSON.stringify(conversations));

                document.getElementById('messageInput').value = '';
                displayConversation(currentChatUser);
            } catch (error) {
                console.error('Error sending message:', error);
                alert('❌ Failed to send message. Please try again.');
            } finally {
                document.getElementById('sendBtn').disabled = false;
            }
        }

        function displayConversation(username) {
            const container = document.getElementById('messagesContainer');
            container.innerHTML = '';
            const messages = conversations[username] || [];

            if (messages.length === 0) {
                container.innerHTML = '<div style="text-align: center; padding: 40px; color: #999;">No messages yet. Start the conversation!</div>';
                return;
            }

            messages.forEach(msg => {
                const messageDiv = document.createElement('div');
                messageDiv.className = msg.from === currentUser.username ? 'message sent' : 'message';

                const time = new Date(msg.timestamp).toLocaleTimeString('en-US', {
                    hour: '2-digit',
                    minute: '2-digit'
                });

                messageDiv.innerHTML = `
                    <div class="message-content">
                        <div class="message-sender">${msg.from === currentUser.username ? 'You' : escapeHtml(msg.from)}</div>
                        <div class="message-text">${escapeHtml(msg.text)}</div>
                        <div class="message-time">${time}</div>
                    </div>
                `;

                container.appendChild(messageDiv);
            });

            container.scrollTop = container.scrollHeight;
        }

        function openReportModal() {
            if (!currentChatUser) return;
            document.getElementById('reportUsername').textContent = currentChatUser;
            document.getElementById('reportModal').classList.add('show');
        }

        function closeReportModal() {
            document.getElementById('reportModal').classList.remove('show');
            document.getElementById('reportReason').value = '';
        }

        async function submitReport() {
            const reason = document.getElementById('reportReason').value.trim();
            if (!reason) {
                alert('Please provide a reason for reporting this user');
                return;
            }

            if (reason.length < 10) {
                alert('Please provide more details (at least 10 characters)');
                return;
            }

            const report = {
                reporter: currentUser.username,
                reported: currentChatUser,
                reason: reason,
                conversation: conversations[currentChatUser] || [],
                timestamp: new Date().toISOString()
            };

            try {
                const channel = ablyClient.channels.get('admin-reports');
                await channel.publish('user-report', report);
                
                alert('✅ Report submitted successfully!\n\nAdmin will review your report and take appropriate action.');
                closeReportModal();
            } catch (error) {
                console.error('Error submitting report:', error);
                alert('❌ Failed to submit report. Please try again.');
            }
        }

        function filterUsers() {
            const searchTerm = document.getElementById('userSearch').value.toLowerCase();
            const filteredUsers = allUsers.filter(user => 
                user.username.toLowerCase().includes(searchTerm)
            );
            displayUsers(filteredUsers);
        }

        function isUserOnline(lastActive) {
            const now = new Date();
            const lastActiveDate = new Date(lastActive);
            const diffMinutes = (now - lastActiveDate) / 1000 / 60;
            return diffMinutes < 5;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function showError(message) {
            const error = document.getElementById('authError');
            error.textContent = message;
            error.style.display = 'block';
            setTimeout(() => error.style.display = 'none', 5000);
        }

        function showSuccess(message) {
            const success = document.getElementById('authSuccess');
            success.textContent = message;
            success.style.display = 'block';
        }

        function clearMessages() {
            document.getElementById('authError').style.display = 'none';
            document.getElementById('authSuccess').style.display = 'none';
        }

        window.addEventListener('beforeunload', () => {
            if (currentUser && ablyClient) {
                fetch(`${CONFIG.BACKEND_URL}/update-status`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: currentUser.username, status: 'offline' }),
                    keepalive: true
                });
            }
        });
    </script>
</body>
</html>
